name: CI

# This tells GitHub WHEN to run this workflow
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# This defines the jobs the robot will do
jobs:
  test:
    # The robot will run this on the latest version of Ubuntu Linux
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Install your dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ADD THIS: Delete old database and create fresh tables
      - name: Setup fresh database
        run: |
          rm -f bookmarks.db
          alembic upgrade head

      # 4. Run Ruff to check for errors and formatting
      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      # 5. Run MyPy to check for type errors
      - name: Type check with MyPy
        run: mypy .

      # 6. Run Pytest to ensure all tests pass
      - name: Test with Pytest
        run: pytest