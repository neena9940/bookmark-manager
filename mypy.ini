[mypy]
# Ignore the frontend and alembic folders
exclude = ^(frontend|alembic)/
ignore_missing_imports = True

# Be less strict about type checking
disallow_untyped_defs = False
check_untyped_defs = False

# Ignore SQLAlchemy Column type issues
warn_return_any = False
warn_unused_ignores = False

# Specific ignores for common SQLAlchemy patterns
[mypy-app.models.*]
disable_error_code = assignment, arg-type

[mypy-app.api.*]
disable_error_code = assignment, arg-type